{% load static %}
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Dodaj doktora</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: url("{% static 'photos/background.png' %}") no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 10px;
            padding: 20px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #0f7b8f;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px 10px;
            margin: 5px 0 15px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 999px;
            border: none;
            background-color: #0f7b8f;
            color: white;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: #0c6270;
        }

        .action-buttons {
            margin-top: 10px;
        }

        .btn-cancel {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 999px;
            background-color: #c0392b;
            color: #ffffff;
            font-size: 1em;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background-color: #a52d23;
        }
    </style>
</head>
<body>
    {% include '_header.html' %}

    <main>
        <div class="card">
            <h1>Dodaj doktora</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="action-buttons">
                    <a href="/users/admin-panel/#section-doctors" class="btn-cancel">
                        Vrati se
                    </a>

                    <button type="submit">Sacuvaj</button>
                </div>
            </form>
        </div>
    </main>

    {% include '_footer.html' %}
</body>
</html>

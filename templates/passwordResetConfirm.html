{% load static %}
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Nova lozinka</title>
    <style>
        :root {
            --brand: #0f7b8f;
            --brand-2: #2563eb;
            --text: #1f2937;
            --muted: #6b7280;
            --card: #ffffff;
            --border: #e5e7eb;
            --shadow: 0 10px 30px rgba(0,0,0,.12);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;

            background: url("{% static 'photos/background.png' %}") no-repeat center center fixed;
            background-size: cover;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--brand);
            font-size: 1.8em;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        form p {
            color: var(--text);
        }

        button {
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--brand);
            background: var(--brand);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #095960;
        }
    </style>
</head>
<body>
    <div class="glass">
        <h1>Nova lozinka</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Sacuvaj novu lozinku</button>
        </form>
    </div>
</body>
</html>

{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Email poslat" %}</title>

    <style>
        :root {
            --brand: #0f7b8f;
            --brand-2: #2563eb;
            --text: #1f2937;
            --muted: #6b7280;
            --card: #ffffff;
            --border: #e5e7eb;
            --shadow: 0 10px 30px rgba(0,0,0,.12);
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background: url("{% static 'photos/background.png' %}") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass {
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        h1 {
            color: var(--brand);
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        p {
            color: var(--text);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        a.btn {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--brand);
            background: var(--brand);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            transition: background .2s, transform .05s;
        }

        a.btn:hover { background: #095960; }
        a.btn:active { transform: translateY(1px); }

    </style>
</head>
<body>
    <div class="glass">
        <h1>{% trans "Proveri email" %}</h1>

        <p>
            {% trans "Ako postoji nalog sa tom email adresom, poslat je link za reset lozinke." %}
        </p>

        <a href="{% url 'users:login' %}" class="btn">
            {% trans "Nazad na prijavu" %}
        </a>
    </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Lozinka promenjena</title>
    <style>
        :root {
            --brand: #0f7b8f;
            --brand-2: #2563eb;
            --text: #1f2937;
            --muted: #6b7280;
            --card: #ffffff;
            --border: #e5e7eb;
            --shadow: 0 10px 30px rgba(0,0,0,.12);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;

            background: url("{% static 'photos/background.png' %}") no-repeat center center fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass {
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: var(--brand);
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        p {
            color: var(--muted);
            font-size: 1em;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--brand);
            background: var(--brand);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: .2px;
            transition: transform .05s, background .2s;
        }

        .btn:hover { background: #095960; }
        .btn:active { transform: translateY(1px); }
    </style>
</head>
<body>
    <div class="glass">
        <h1>Lozinka je uspesno promenjena</h1>
        <p>Sada se mozes prijaviti novom lozinkom.</p>
        <a class="btn" href="{% url 'users:login' %}">Prijava</a>
    </div>
</body>
</html>
